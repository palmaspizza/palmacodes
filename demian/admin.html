<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060b"><title>Panel · Barbería</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--s1:#0d0e1d;--s2:#15162d;--line:#26284f;--ac:#7f7bd9;--ac2:#b5b1ff;--tx:#ecebf8;--mu:#9391b3;--bad:#ff7b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font:500 15px/1.5 Manrope,system-ui,sans-serif;background:linear-gradient(170deg,#030306 0%,#0a0b1c 50%,#1f1d4a 100%) fixed;padding-bottom:84px}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;letter-spacing:.02em;font-weight:700}h2{font-size:26px;margin:22px 0 10px}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:30;background:rgba(6,6,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:12px;height:62px}header img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--ac)}
header h1{font-size:24px;flex:1}.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--s1);border:1px solid var(--line)}.ib.on{color:#3ddc84}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#080914;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;font-size:11px;color:var(--mu)}nav button svg{font-size:22px}nav button.on{color:var(--ac2)}
@media(min-width:800px){nav{position:static;justify-content:center;background:none;border:0;gap:8px;padding:14px 0 0}nav button{flex:none;flex-direction:row;gap:8px;font-size:14px;padding:10px 16px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}nav button.on{background:var(--s2);border-color:var(--ac)}body{padding-bottom:30px}}
.card{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;background:linear-gradient(135deg,#4f4bb8,var(--ac));color:#fff;font-weight:700}
.btn.g{background:#17a34a;width:100%}.btn.o{background:var(--s2);border:1px solid var(--line)}.btn.d{background:none;color:var(--bad);border:1px solid #4a2530}.btn.w{width:100%}
input,textarea,select{width:100%;background:#090a18;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px}
label{display:block;margin:0 0 5px;color:var(--mu);font-size:13px}.f{margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bk{display:flex;gap:14px}.bk .t{font:700 26px 'Barlow Condensed';color:var(--ac2);min-width:58px}.bk .in{flex:1;min-width:0}.bk small{color:var(--mu)}
.bk .ac{display:flex;gap:8px;margin-top:10px}.bk .ac .ib{width:46px;flex:none;color:var(--bad)}
.empty,.msg{color:var(--mu);text-align:center;padding:36px 10px}.empty svg{font-size:36px;display:block;margin:0 auto 8px}
.sw{display:flex;align-items:center;gap:8px}.sw input{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
.hrow{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center;margin-bottom:10px}.hrow .n{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
@media(min-width:600px){.hrow{grid-template-columns:130px 70px 1fr 1fr}.hrow .n{display:contents}}
.thumb{width:100%;height:140px;border-radius:12px;object-fit:cover;background:#10112a;display:grid;place-items:center;color:var(--ac);margin-bottom:10px}
.up{position:relative;display:block;cursor:pointer}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}.up .b{position:absolute;right:8px;bottom:18px;background:rgba(6,6,11,.85);padding:7px 12px;border-radius:99px;font-size:13px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gal div{position:relative}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.gal button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:50%;background:rgba(6,6,11,.85);color:var(--bad);display:grid;place-items:center}
@media(min-width:700px){.gal{grid-template-columns:repeat(5,1fr)}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:700;z-index:90;display:none;max-width:90vw}
#lg{min-height:100vh;display:grid;place-items:center;padding:20px}#lg .card{width:100%;max-width:380px;padding:24px}
.err{color:var(--bad)}.stars{color:#f5c451}.stars svg{fill:currentColor;stroke:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
<symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/></symbol>
<symbol id="i-cfg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></symbol>
<symbol id="i-wa" viewBox="0 0 24 24"><path d="M3 21l1.7-5A9 9 0 1112 21a9 9 0 01-4.3-1.1z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a4 4 0 01-2-2l.8-1-1-2z"/></symbol>
</defs></svg>

<div id="lg"><form class="card" id="lf"><h1 style="font-size:34px;margin-bottom:4px">Panel del barbero</h1><p style="color:var(--mu);margin:0 0 18px">Ingresa para gestionar tus reservas.</p>
<div class="f"><label for="em">Correo</label><input id="em" type="email" autocomplete="username" required></div>
<div class="f"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>
<p class="err" id="le" hidden></p><button class="btn w">Entrar</button></form></div>

<div id="app" hidden>
<header><div class="wrap"><img src="logo.png" alt=""><h1>Panel</h1><button class="ib" id="bell" aria-label="Activar notificaciones"><svg class="i"><use href="#i-bell"/></svg></button><button class="ib" id="out" aria-label="Salir"><svg class="i"><use href="#i-out"/></svg></button></div></header>
<div class="wrap"><nav id="nav"></nav><main id="mn"></main></div></div>
<div id="toast" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue,set,push,update,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
/* === CLOUDINARY: crea un "upload preset" sin firma y pon tus datos aquí === */
const CLOUD='dkszomv2f',PRESET='demian';
const fb=initializeApp({apiKey:"AIzaSyCSqgJA6uL8SkY-kphhuaR9TuGPulucPic",authDomain:"ajedrez-65b15.firebaseapp.com",databaseURL:"https://ajedrez-65b15-default-rtdb.firebaseio.com",projectId:"ajedrez-65b15",storageBucket:"ajedrez-65b15.firebasestorage.app",messagingSenderId:"501222935015",appId:"1:501222935015:web:bb08aeab5af07a77eb1542"});
const db=getDatabase(fb),auth=getAuth(fb),B='barberia',STEP=30,$=s=>document.querySelector(s),R=p=>ref(db,B+'/'+p);
const I=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00:00'),m=h=>{const[a,b]=h.split(':');return a*60+ +b},k=n=>String(n/60|0).padStart(2,'0')+String(n%60).padStart(2,'0');
const money=n=>'$'+Number(n||0).toLocaleString('es-CL'),fl=s=>pd(s).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}),cl=(u,w)=>u&&u.includes('/upload/')?u.replace('/upload/',`/upload/f_auto,q_auto,w_${w}/`):u;
const DW=Object.fromEntries([0,1,2,3,4,5,6].map(d=>[d,{open:d>0,start:'09:00',end:'20:00'}])),DN=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
let C={},SV={},SC={},GL={},RV={},BK={},tab='res',seen=null,reg=null,busy=0;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)};

/* Sesión */
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').hidden=true;try{await signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch{$('#le').hidden=false;$('#le').textContent='Correo o contraseña incorrectos.'}};
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$('#lg').hidden=!!u;$('#app').hidden=!u;if(u)start()});
let started=false;
function start(){if(started)return;started=true;
 const on=(p,f)=>onValue(R(p),s=>{f(s.val()||{});render()});
 on('config',v=>C=v);on('services',v=>SV=v);on('schedule',v=>SC=v);on('gallery',v=>GL=v);on('reviews',v=>RV=v);
 onValue(R('bookings'),s=>{BK=s.val()||{};const ids=Object.keys(BK);if(seen)ids.filter(i=>!seen.has(i)).forEach(i=>notify(i,BK[i]));seen=new Set(ids);render()});
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(r=>reg=r).catch(()=>{});bellUI()}

/* Notificaciones (el panel debe estar abierto en el dispositivo) */
function bellUI(){$('#bell').classList.toggle('on','Notification'in window&&Notification.permission==='granted')}
$('#bell').onclick=async()=>{if(!('Notification'in window))return toast('Este navegador no admite notificaciones.');const p=await Notification.requestPermission();bellUI();toast(p==='granted'?'Notificaciones activadas':'Permiso denegado en el navegador')};
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6)}catch{}}
function notify(id,b){const body=`${b.name} · ${b.service} · ${fl(b.date)} ${b.time}`;toast('Nueva reserva: '+body);beep();
 if('Notification'in window&&Notification.permission==='granted'){const o={body,icon:'logo.png',badge:'logo.png',tag:id,vibrate:[200,100,200,100,300]};reg?reg.showNotification('Nueva reserva',o):new Notification('Nueva reserva',o)}}

/* Cloudinary: comprime en el celular y sube */
async function up(file,max=1600){const bmp=await createImageBitmap(file),sc=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8)),f=new FormData();f.append('file',blob);f.append('upload_preset',PRESET);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:f}),j=await r.json();if(!j.secure_url)throw new Error(j.error?.message||'Error al subir');return j.secure_url}
const upl=async(file,max)=>{try{toast('Subiendo imagen…');return await up(file,max)}catch(e){toast('No se pudo subir: '+e.message);return null}};

/* Navegación */
const TABS=[['res','cal','Reservas'],['srv','scissors','Servicios'],['hor','clock','Horarios'],['gal','img','Galería'],['rev','star','Reseñas'],['cfg','cfg','Ajustes']];
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${I(t[1])}<span>${t[2]}</span></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render(true)}};
function render(force){const a=document.activeElement;if(!force&&a&&a.closest&&a.closest('#mn')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#mn').innerHTML=V[tab]()}

const V={
res(){const t=iso(new Date()),l=Object.entries(BK).map(([id,b])=>({id,...b})).filter(b=>b.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),hoy=l.filter(b=>b.date===t);
 if(!l.length)return`<div class="empty">${I('cal')}Aún no hay reservas próximas.</div>`;
 let h=`<h2>Hoy: ${hoy.length} reserva${hoy.length==1?'':'s'}</h2><p style="color:var(--mu);margin:0 0 6px">Ingreso estimado ${money(hoy.reduce((a,b)=>a+b.price,0))}</p>`,cur='';
 for(const b of l){if(b.date!==cur){cur=b.date;h+=`<h2 style="font-size:20px;color:var(--ac2);text-transform:capitalize">${fl(b.date)}${b.date===t?' (hoy)':''}</h2>`}
  const wa=`https://wa.me/${b.phone}?text=${encodeURIComponent(`Hola ${b.name}, te escribo de ${C.name||'la barbería'} por tu reserva de ${b.service} el ${fl(b.date)} a las ${b.time}. Valor: ${money(b.price)}. ¡Te esperamos!`)}`;
  h+=`<div class="card bk"><div class="t">${b.time}</div><div class="in"><b>${esc(b.name)}</b><br><small>${esc(b.service)} · ${b.duration} min · ${money(b.price)}</small><div class="ac"><a class="btn g" href="${wa}" target="_blank" rel="noopener">${I('wa')} Contactar</a><button class="ib" data-del="${b.id}" aria-label="Cancelar reserva">${I('trash')}</button></div></div></div>`}return h},
srv(){const l=Object.entries(SV).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
 return`<h2>Servicios</h2>`+(l.length?'':`<div class="card msg">Aún no hay servicios.<br><br><button class="btn" data-seed>Cargar servicios iniciales</button></div>`)+l.map(([id,s])=>`<div class="card" data-sv="${id}">
 <label class="up">${s.img?`<img class="thumb" src="${esc(cl(s.img,600))}" alt="">`:`<div class="thumb" style="font-size:34px">${I('cam')}</div>`}<span class="b">Cambiar foto</span><input type="file" accept="image/*" data-simg="${id}"></label>
 <div class="f"><label>Nombre</label><input name="name" value="${esc(s.name)}"></div>
 <div class="two"><div class="f"><label>Precio (CLP)</label><input name="price" type="number" inputmode="numeric" value="${s.price||0}"></div><div class="f"><label>Duración (min)</label><input name="duration" type="number" inputmode="numeric" step="30" value="${s.duration||30}"></div></div>
 <div class="f"><label>Descripción</label><textarea name="desc" rows="3">${esc(s.desc)}</textarea></div>
 <label class="sw f"><input type="checkbox" name="active" ${s.active!==false?'checked':''}> Visible para clientes</label>
 <div class="two"><button class="btn" data-ssave="${id}">Guardar</button><button class="btn d" data-sdel="${id}">Eliminar</button></div></div>`).join('')+`<button class="btn o w" data-snew>${I('plus')} Nuevo servicio</button>`},
hor(){const wk=d=>SC.week?.[d]||DW[d],row=d=>{const w=wk(d);return`<div class="hrow" data-wd="${d}"><div class="n"><b>${DN[d]}</b><label class="sw" style="margin:0"><input type="checkbox" ${w.open?'checked':''}> ${'Abierto'}</label></div><input type="time" value="${w.start}" aria-label="Apertura"><input type="time" value="${w.end}" aria-label="Cierre"></div>`};
 const ex=Object.entries(SC.exc||{}).filter(e=>e[0]>=iso(new Date())).sort();
 return`<h2>Horario semanal</h2><div class="card"><p style="margin:0 0 12px;color:var(--mu)">Cada cambio se guarda al instante. Desactiva "Abierto" para cerrar ese día todas las semanas.</p>${[1,2,3,4,5,6,0].map(row).join('')}
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><label>Mismo horario de lunes a sábado</label><div class="two" id="bulk"><input type="time" value="${wk(1).start}"><input type="time" value="${wk(1).end}"></div><button class="btn o w" style="margin-top:10px" data-bulk>Aplicar a lunes - sábado</button></div>
 <h2>Día específico</h2><div class="card"><div class="f"><label>Fecha</label><input type="date" id="xd" min="${iso(new Date())}"></div><div class="f"><label>Ese día</label><select id="xm"><option value="c">Cerrado</option><option value="h">Horario especial</option></select></div><div class="two"><input type="time" id="xs" value="10:00"><input type="time" id="xe" value="16:00"></div><button class="btn w" style="margin-top:10px" data-xadd>Guardar día específico</button></div>
 ${ex.map(([d,v])=>`<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="text-transform:capitalize">${fl(d)}<br><small style="color:var(--mu)">${v.closed?'Cerrado':v.start+' - '+v.end}</small></span><button class="ib" data-xdel="${d}" aria-label="Quitar">${I('trash')}</button></div>`).join('')}`},
gal(){const l=Object.entries(GL).sort((a,b)=>b[1].createdAt-a[1].createdAt);return`<h2>Galería</h2><label class="btn w" style="position:relative;cursor:pointer">${I('cam')} Subir fotos<input type="file" accept="image/*" multiple data-gup style="position:absolute;inset:0;opacity:0;cursor:pointer"></label><div class="gal" style="margin-top:14px">${l.map(([id,g])=>`<div><img src="${esc(cl(g.url,400))}" alt="" loading="lazy"><button data-gdel="${id}" aria-label="Eliminar foto">${I('trash')}</button></div>`).join('')}</div>${l.length?'':'<p class="msg">Sube las fotos de tus trabajos desde el celular.</p>'}`},
rev(){const l=Object.entries(RV).sort((a,b)=>b[1].createdAt-a[1].createdAt);return`<h2>Reseñas</h2>`+(l.map(([id,r])=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(r.name)}</b><span class="stars">${[1,2,3,4,5].map(i=>`<span style="opacity:${i<=r.rating?1:.25}">${I('star')}</span>`).join('')}</span></div><p style="margin:6px 0 10px">${esc(r.text)}</p><button class="btn d" data-rdel="${id}">Eliminar</button></div>`).join('')||'<p class="msg">Todavía no hay reseñas.</p>')},
cfg(){return`<h2>Banner</h2><div class="card"><label class="up"><img class="thumb" style="height:160px" src="${C.bannerUrl?esc(cl(C.bannerUrl,800)):'bannerimg.webp'}" alt=""><span class="b">Cambiar banner</span><input type="file" accept="image/*" data-banner></label></div>
 <h2>Datos del negocio</h2><div class="card" id="cf"><div class="f"><label>Nombre</label><input name="name" value="${esc(C.name||'DEMIAN')}"></div><div class="f"><label>Dirección</label><input name="address" value="${esc(C.address||'Perpetua Freire 589, La Florida, Santiago, Chile')}"></div><button class="btn w" data-csave>Guardar datos</button></div>
 <p style="color:var(--mu);font-size:13px">El logo es el archivo <b>logo.png</b> junto a las páginas.</p>`}};

/* Acciones */
const SEED=[['Corte de cabello',15000,45,'Corte con opción de perfilado de ceja y mascarilla de puntos negros.'],['Servicio premium + bebestible',16990,60,'Corte, perfilado de cejas, lavado, tratamiento anti ojeras y bebestible.'],['Servicio premium + barba + bebestible',22000,60,'Corte, perfilado de barba y cejas, lavado, tratamiento anti ojeras y bebestible.'],['Corte de cabello + barba',20000,45,'Corte más perfilado de barba, con opción de perfilado de cejas.'],['Color global platinado + corte',70000,240,'Platinado global con productos de alta calidad.'],['Visos + corte de cabello',60000,240,'Visos platinados con productos de alta calidad.']];
$('#mn').onclick=async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.del){const b=BK[d.del];if(!b||!confirm(`¿Cancelar la reserva de ${b.name}?`))return;const u={};for(let x=m(b.time);x<m(b.time)+b.duration;x+=STEP)u[`${B}/taken/${b.date}/${k(x)}`]=null;u[`${B}/bookings/${d.del}`]=null;await update(ref(db),u);toast('Reserva cancelada')}
 else if(d.seed!==undefined){const u={};SEED.forEach((s,i)=>u[`${B}/services/s${i+1}`]={name:s[0],price:s[1],duration:s[2],desc:s[3],active:true,order:i});await update(ref(db),u)}
 else if(d.snew!==undefined)push(R('services'),{name:'Nuevo servicio',price:0,duration:30,desc:'',active:true,order:Date.now()});
 else if(d.ssave){const c=t.closest('[data-sv]'),q=n=>c.querySelector(`[name=${n}]`);await update(R('services/'+d.ssave),{name:q('name').value.trim(),price:+q('price').value||0,duration:Math.max(30,Math.ceil((+q('duration').value||30)/30)*30),desc:q('desc').value.trim(),active:q('active').checked});toast('Servicio guardado')}
 else if(d.sdel){if(confirm('¿Eliminar este servicio?'))remove(R('services/'+d.sdel))}
 else if(d.bulk!==undefined){const i=$('#bulk').querySelectorAll('input'),u={};for(const x of[1,2,3,4,5,6])u[`${B}/schedule/week/${x}`]={open:SC.week?.[x]?.open??true,start:i[0].value,end:i[1].value};await update(ref(db),u);toast('Horario aplicado')}
 else if(d.xadd!==undefined){const dt=$('#xd').value;if(!dt)return toast('Elige una fecha');await set(R('schedule/exc/'+dt),$('#xm').value==='c'?{closed:true}:{start:$('#xs').value,end:$('#xe').value});toast('Guardado')}
 else if(d.xdel)remove(R('schedule/exc/'+d.xdel));
 else if(d.gdel){if(confirm('¿Eliminar esta foto?'))remove(R('gallery/'+d.gdel))}
 else if(d.rdel){if(confirm('¿Eliminar esta reseña?'))remove(R('reviews/'+d.rdel))}
 else if(d.csave!==undefined){const c=$('#cf');await update(R('config'),{name:c.querySelector('[name=name]').value.trim(),address:c.querySelector('[name=address]').value.trim()});toast('Datos guardados')}};
$('#mn').onchange=async e=>{const t=e.target,d=t.dataset;
 const wd=t.closest('[data-wd]');if(wd){const i=wd.querySelectorAll('input');await set(R('schedule/week/'+wd.dataset.wd),{open:i[0].checked,start:i[1].value,end:i[2].value});toast('Horario guardado');return}
 const f=t.files&&t.files[0];if(!f)return;
 if(d.simg){const u=await upl(f);if(u){await update(R('services/'+d.simg),{img:u});toast('Foto actualizada')}}
 else if(d.banner!==undefined){const u=await upl(f,2000);if(u){await update(R('config'),{bannerUrl:u});toast('Banner actualizado')}}
 else if(d.gup!==undefined){let n=0;for(const x of t.files){const u=await upl(x);if(u){await set(push(R('gallery')),{url:u,createdAt:Date.now()});n++}}toast(n+' foto'+(n==1?'':'s')+' subida'+(n==1?'':'s'))}
 t.value=''};
