 $("fn").textContent=C.name;$("yr").textContent=new Date().getFullYear();renderCart()}

 document.querySelectorAll("#cfl [id^=cf_]").forEach(e=>{if(e.value.trim()){const k=e.id.slice(3);L.push(`${{ent:"Entrega",pago:"Pago"}[k]||LBL[k]}: ${e.value.trim()}`)}});
 const msg=L.join("\n");if(wa(msg).length>1900){try{navigator.clipboard.writeText(msg);toast("Pedido largo: copiado, pégalo en el chat")}catch(e){}window.open("https://wa.me/"+String(C.wa||"").replace(/\D/g,""),"_blank","noopener")}else window.open(wa(msg),"_blank","noopener")};
$("cbtn").onclick=()=>$("dr").classList.add("on");$("dx").onclick=()=>$("dr").classList.remove("on");

/* ===== Cotizador ===== */
$("qf").onsubmit=e=>{e.preventDefault();window.open(wa(`Hola ${C.name}, soy ${$("qn").value}. Quiero cotizar: ${$("qsv").value||"un servicio"}.\n${$("qd").value}\nMi teléfono: ${$("qp").value}`),"_blank","noopener")};
