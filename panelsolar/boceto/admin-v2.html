<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Panel de administración</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="icons-v2.js"></script>
<style>
:root{--ink:#0E1B2C;--mut:#5B6B82;--a:#F5A524;--bg:#F3F6FA;--card:#fff;--ln:#D9E3EE;--ok:#1F9D6B;--bad:#C0392B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',sans-serif}h1,h2,h3{font-family:Sora,sans-serif;margin:0}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lb{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:32px;width:min(380px,100%);display:grid;gap:12px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ln);border-radius:9px;padding:10px 12px}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(245,165,36,.4);border-color:var(--a)}
input[type=color]{padding:2px;height:42px}input[type=checkbox]{width:20px;height:20px}
.b{font:700 14px 'DM Sans';border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--ink);color:#fff}.b.a{background:var(--a);color:var(--ink)}.b.g{background:transparent;color:var(--ink);border:1.5px solid var(--ln)}.b.r{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.top{background:var(--ink);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 20px 0;max-width:1000px;margin:0 auto}
.tabs button{font:700 14px 'DM Sans';background:none;border:1.5px solid var(--ln);border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--ink)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:16px 20px 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.l{display:block;font-weight:700;font-size:13px;margin:0 0 4px}
.img{display:flex;gap:10px;align-items:center}.img img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--ln);flex:none}
.act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sv{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);padding:12px 20px;display:flex;justify-content:flex-end;gap:10px;z-index:6}
.t{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:9;pointer-events:none}.t.on{opacity:1}
h2{font-size:18px;margin-bottom:12px}.h{color:var(--mut);font-size:13px}
</style></head><body>

<!-- ============ LOGIN ============ -->
<div id="login"><form class="lb" id="lf"><h1 style="font-size:22px">Panel de administración</h1><p class="h">Ingresa con tu correo y contraseña.</p>
<input id="em" type="email" placeholder="Correo" autocomplete="username" required><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<button class="b a">Ingresar</button><p id="le" style="color:var(--bad);min-height:20px;margin:0"></p></form></div>

<div id="app" class="hide">
<div class="top"><b id="tn">Panel</b><span><a href="../index.html" target="_blank" style="color:#fff;margin-right:14px">Ver sitio</a><button class="b g" style="color:#fff;border-color:#fff4" id="out">Salir</button></span></div>
<div class="tabs" id="tabs"></div><main id="m"></main>
<div class="sv"><span class="h" style="align-self:center" id="info"></span><button class="b a" id="save">Guardar cambios</button></div></div>
<div class="t" id="t"></div>

<script>
/* ===== Firebase ===== */
firebase.initializeApp({apiKey:"AIzaSyDBEB8Q27hldB1_HKBEaJYfF5Ef1Xw382Q",authDomain:"taxislascondes-a37d4.firebaseapp.com",databaseURL:"https://taxislascondes-a37d4-default-rtdb.firebaseio.com",projectId:"taxislascondes-a37d4",appId:"1:803772576117:web:9e0eeda78e0f55aa13e33c"});
const db=firebase.database(),R=p=>db.ref("solar/"+p),$=id=>document.getElementById(id);
const CLOUD="dkszomv2f",PRESET="demian";

/* ==========================================================
   AUTENTICACIÓN (Firebase Auth) — AQUÍ VA EL CÓDIGO DEL LOGIN
   1) Firebase Console > Authentication > Sign-in method > habilita "Correo y contraseña".
   2) Authentication > Users > "Agregar usuario": [correo del administrador] + contraseña.
   3) Este mismo correo está autorizado en las reglas de la base de datos.
   ========================================================== */
const auth=firebase.auth();
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";
 try{await auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value)}
 catch(err){$("le").textContent="Correo o contraseña incorrectos."}};
$("out").onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{$("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);if(u)tab("cfg")});
/* ========================================================== */

const toast=t=>{$("t").textContent=t;$("t").classList.add("on");setTimeout(()=>$("t").classList.remove("on"),2000)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function upload(file){const f=new FormData();f.append("file",file);f.append("upload_preset",PRESET);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:"POST",body:f});if(!r.ok)throw new Error("Cloudinary");return (await r.json()).secure_url}

/* ===== Esquemas: [clave, etiqueta, tipo] ===== */
const CFG=[
 ["Empresa",[["name","Nombre del negocio"],["tagline","Eslogan"],["years","Años de experiencia","number"],["projectsCount","Proyectos realizados","number"],["stat3v","Dato extra (valor)"],["stat3l","Dato extra (texto)"],["about","Quiénes somos","area"]]],
 ["Imágenes",[["logo","Logo","img"],["heroImg","Imagen principal","img"],["aboutImg","Imagen de “Quiénes somos”","img"]]],
 ["Contacto",[["wa","WhatsApp de pedidos (ej: 56912345678)","tel"],["phone","Teléfono"],["email","Correo"],["address","Dirección"],["hours","Horario"],["ig","Link Instagram"],["fb","Link Facebook"]]],
 ["Colores",[["theme/primary","Color principal","color"],["theme/accent","Color de acento","color"],["theme/bg","Fondo","color"],["theme/text","Texto","color"]]],
 ["Textos de la página",[["texts/heroTitle","Título principal"],["texts/heroSub","Subtítulo principal","area"],["texts/heroCta","Botón principal"],["texts/aboutTitle","Título Quiénes somos"],["texts/servicesTitle","Título Servicios"],["texts/servicesSub","Bajada Servicios"],["texts/productsTitle","Título Productos"],["texts/productsSub","Bajada Productos"],["texts/projectsTitle","Título Proyectos"],["texts/projectsSub","Bajada Proyectos"],["texts/quoteTitle","Título Cotización"],["texts/quoteSub","Bajada Cotización"],["texts/faqTitle","Título Preguntas"]]],
 ["Carrito de compra",[["delivery","Formas de entrega (separadas por coma)"],["payments","Formas de pago (separadas por coma)"],["cartFields/nombre","Pedir nombre","check"],["cartFields/telefono","Pedir teléfono","check"],["cartFields/direccion","Pedir dirección","check"],["cartFields/comuna","Pedir comuna","check"],["cartFields/correo","Pedir correo","check"],["cartFields/rut","Pedir RUT","check"],["cartFields/comentarios","Pedir comentarios","check"]]],
 ["Secciones visibles",[["sections/nosotros","Quiénes somos","check"],["sections/servicios","Servicios","check"],["sections/productos","Productos","check"],["sections/proyectos","Proyectos","check"],["sections/cotiza","Cotización","check"],["sections/faq","Preguntas frecuentes","check"]]]];
const COL={
 products:["Productos",[["name","Nombre"],["price","Precio (CLP)","number"],["stock","Stock (0 = agotado, vacío = sin control)","number"],["order","Orden","number"],["img","Imagen","img"],["desc","Descripción","area"],["active","Visible","check"]],"name"],
 services:["Servicios",[["title","Título"],["icon","Ícono","icon"],["order","Orden","number"],["desc","Descripción","area"]],"title"],
 projects:["Proyectos",[["title","Título"],["order","Orden","number"],["img","Foto","img"]],"title"],
 faq:["Preguntas",[["q","Pregunta"],["order","Orden","number"],["a","Respuesta","area"]],"q"]};
const CHK_DEF={"cartFields/comuna":false,"cartFields/correo":false,"cartFields/rut":false};
const get=(o,p)=>p.split("/").reduce((a,k)=>a==null?a:a[k],o);

/* ===== Campo ===== */
function field(f,v,id){const[k,l,t]=f;let c;
 if(t==="area")c=`<textarea data-k="${k}" rows="3">${esc(v)}</textarea>`;
 else if(t==="check")return `<label class="l" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-k="${k}" ${(v===undefined?CHK_DEF[k]!==false:v!==false&&v!=="")?"checked":""}>${l}</label>`;
 else if(t==="icon")c=`<select data-k="${k}">${Object.keys(iconLabels).map(n=>`<option value="${n}" ${(v||"bolt")===n?"selected":""}>${iconLabels[n]}</option>`).join("")}</select>`;
 else if(t==="color")c=`<input type="color" data-k="${k}" value="${esc(v||"#000000")}">`;
 else if(t==="img")c=`<div class="img"><img src="${esc(v||"")}" alt="" ${v?"":'style="visibility:hidden"'}><div style="flex:1"><input type="file" accept="image/*" data-up="${k}"><input type="hidden" data-k="${k}" value="${esc(v||"")}"><span class="h">Se sube a Cloudinary</span></div></div>`;
 else c=`<input data-k="${k}" type="${t==="number"?"number":t==="tel"?"tel":"text"}" value="${esc(v)}">`;
 return `<div><label class="l">${l}</label>${c}</div>`}
document.addEventListener("change",async e=>{const i=e.target.dataset.up;if(!i)return;const box=e.target.closest(".img"),file=e.target.files[0];if(!file)return;
 toast("Subiendo imagen…");try{const u=await upload(file);box.querySelector("[data-k]").value=u;const im=box.querySelector("img");im.src=u;im.style.visibility="visible";toast("Imagen lista. Guarda los cambios.")}catch(x){toast("Error al subir la imagen")}});
function read(scope){const o={};scope.querySelectorAll("[data-k]").forEach(e=>{let v=e.type==="checkbox"?e.checked:e.type==="number"?(e.value===""?null:+e.value):e.value;o[e.dataset.k]=v});return o}

/* ===== Pestañas ===== */
const TABS=[["cfg","Ajustes y diseño"],...Object.entries(COL).map(([k,v])=>[k,v[0]])];
$("tabs").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
$("tabs").onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};
let cur="cfg";
async function tab(t){cur=t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 const m=$("m");$("save").classList.toggle("hide",t!=="cfg");
 if(t==="cfg"){const c=(await R("config").once("value")).val()||{};$("tn").textContent=c.name||"Panel";$("info").textContent="Los cambios se ven al instante en el sitio.";
  m.innerHTML=CFG.map(([h,fs])=>`<div class="card"><h2>${h}</h2><div class="row">${fs.map(f=>field(f,get(c,f[0]))).join("")}</div></div>`).join("");return}
 const[title,fs,main]=COL[t];$("info").textContent="";const data=(await R(t).once("value")).val()||{};
 const items=Object.entries(data).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
 m.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0">${title} (${items.length})</h2><button class="b a" id="new">+ Agregar</button></div><div id="L"></div>`;
 const L=$("L");const add=(id,v)=>{const d=document.createElement("div");d.className="card";d.dataset.id=id||"";
  d.innerHTML=`<div class="row">${fs.map(f=>field(f,v[f[0]])).join("")}</div><div class="act"><button class="b a" data-s>Guardar</button><button class="b r" data-d>Eliminar</button></div>`;L.appendChild(d);return d};
 items.forEach(([id,v])=>add(id,v));$("new").onclick=()=>add("",{active:true,order:items.length+1}).scrollIntoView({behavior:"smooth"});
 L.onclick=async e=>{const card=e.target.closest(".card");if(!card)return;
  if(e.target.dataset.s!==undefined){const v=read(card);Object.keys(v).forEach(k=>{if(v[k]===null)delete v[k]});
   if(!String(v[main]||"").trim()){toast("Falta: "+fs.find(f=>f[0]===main)[1]);return}
   try{if(card.dataset.id)await R(t+"/"+card.dataset.id).set(v);else card.dataset.id=R(t).push(v).key;toast("Guardado")}catch(x){toast("Error: sin permiso o sin conexión")}}
  if(e.target.dataset.d!==undefined&&confirm("¿Eliminar este elemento?")){if(card.dataset.id)await R(t+"/"+card.dataset.id).remove();card.remove();toast("Eliminado")}}}
$("save").onclick=async()=>{const v=read($("m")),u={};
 Object.entries(v).forEach(([k,x])=>{u[k]=(x===null||x==="")?null:x});
 try{await R("config").update(u);toast("Cambios guardados")}catch(e){toast("Error: sin permiso o sin conexión")}};
</script></body></html>
